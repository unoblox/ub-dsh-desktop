name: Build beta installers

# Beta installers for every desktop platform, built on native runners
# (packaging is never cross-compiled: scripts/verify-target refuses it) with
# electron-builder.beta.cjs: product "unoblox works", macOS (Apple Silicon only
# for the beta) ad-hoc signed, Windows unsigned. Each build is versioned
# <package.json version>-beta.<run number>, so every build is newer than the
# last. Each job launches the packaged app and checks it starts; the
# installers are kept as workflow artifacts.
#
# With "publish" ticked, a green build is also released to the public
# releases repository with a signed latest.json, which installed apps update
# from (src/main/update). That needs two repository secrets:
#   UPDATE_SIGNING_KEY  Ed25519 private key (PEM) matching UPDATE_PUBLIC_KEY
#   RELEASES_TOKEN      token allowed to create releases in the releases repo
#
# Code signing turns on when its secrets exist (docs/code-signing.md):
#   macOS    MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD (Developer ID Application .p12)
#            APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER (notarization)
#   Windows  ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID,
#            ESIGNER_TOTP_SECRET (SSL.com eSigner), or AZURE_TENANT_ID,
#            AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT,
#            AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE (Azure signing)
# Without them macOS stays ad-hoc signed and Windows unsigned.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
      publish:
        description: Publish as an over-the-air update (all platforms must pass)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  # A job-level `if:` cannot read `matrix` (it is evaluated before the matrix
  # expands), so the platform choice filters the matrix here instead.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          TARGET: ${{ inputs.target || 'all' }}
          ROWS: |
            [
              {"label": "macOS Apple Silicon", "family": "macos", "runner": "macos-15", "platform": "darwin", "arch": "arm64",
               "builder": "npx --no-install electron-builder --mac --arm64", "artifact": "macos-apple-silicon", "unpacked": "dist-beta/mac-arm64", "files": "dist-beta/*.dmg\ndist-beta/*.zip"},
              {"label": "Windows x64", "family": "windows", "runner": "windows-2022", "platform": "win32", "arch": "x64",
               "builder": "node scripts/electron-builder-windows.mjs --win --x64", "artifact": "windows-x64", "unpacked": "dist-beta/win-unpacked", "files": "dist-beta/*-setup.exe"},
              {"label": "Linux x64", "family": "linux", "runner": "ubuntu-24.04", "platform": "linux", "arch": "x64",
               "builder": "npx --no-install electron-builder --linux --x64", "artifact": "linux-x64", "unpacked": "/opt/unoblox works", "files": "dist-beta/*.AppImage\ndist-beta/*.deb"}
            ]
        run: echo "include=$(jq -c --arg t "$TARGET" '[.[] | select($t == "all" or .family == $t)]' <<< "$ROWS")" >> "$GITHUB_OUTPUT"

  installers:
    name: ${{ matrix.label }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    env:
      MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
      MAC_NOTARIZING: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
      # eSigner bills per signature, so only published builds are signed with it.
      ESIGNER_SIGNING: ${{ inputs.publish && secrets.ESIGNER_USERNAME != '' && secrets.ESIGNER_PASSWORD != '' && secrets.ESIGNER_CREDENTIAL_ID != '' && secrets.ESIGNER_TOTP_SECRET != '' }}
      AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Test
        run: npx --no-install vitest run
        timeout-minutes: 20
      - name: Set the beta version
        shell: bash
        run: |
          base="$(node -p "require('./package.json').version")"
          npm version --no-git-tag-version --allow-same-version "$base-beta.${{ github.run_number }}"
      - name: Provide the macOS signing certificate
        if: matrix.platform == 'darwin' && env.MAC_SIGNING == 'true'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          {
            echo "CSC_LINK=$MAC_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Prepare the Apple notarization key
        if: matrix.platform == 'darwin' && env.MAC_NOTARIZING == 'true'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          {
            echo "APPLE_API_KEY=$key_path"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Install SSL.com CodeSignTool
        if: matrix.platform == 'win32' && env.ESIGNER_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/codesigntool"
          mkdir -p "$dir"
          curl -fsSL -o "$RUNNER_TEMP/codesigntool.zip" https://www.ssl.com/download/codesigntool-for-windows/
          unzip -q "$RUNNER_TEMP/codesigntool.zip" -d "$dir"
          # The archive may hold the tool in a top-level folder.
          tool="$(dirname "$(find "$dir" -type d -name jar -print -quit)")"
          test -d "$tool/jar"
          echo "CODESIGNTOOL_DIR=$tool" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Each platform sees only its own signing secrets. The macOS
          # certificate comes from the step above, only when it exists:
          # electron-builder reads an empty CSC_LINK as a path and fails.
          ESIGNER_USERNAME: ${{ matrix.platform == 'win32' && inputs.publish && secrets.ESIGNER_USERNAME || '' }}
          ESIGNER_PASSWORD: ${{ matrix.platform == 'win32' && inputs.publish && secrets.ESIGNER_PASSWORD || '' }}
          ESIGNER_CREDENTIAL_ID: ${{ matrix.platform == 'win32' && inputs.publish && secrets.ESIGNER_CREDENTIAL_ID || '' }}
          ESIGNER_TOTP_SECRET: ${{ matrix.platform == 'win32' && inputs.publish && secrets.ESIGNER_TOTP_SECRET || '' }}
          AZURE_TENANT_ID: ${{ matrix.platform == 'win32' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win32' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win32' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.platform == 'win32' && secrets.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ matrix.platform == 'win32' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ matrix.platform == 'win32' && secrets.AZURE_SIGNING_PROFILE || '' }}
        run: node scripts/verify-target.mjs ${{ matrix.platform }} ${{ matrix.arch }} && ${{ matrix.builder }} --publish never --config electron-builder.beta.cjs
      - name: Check the macOS signature users get
        if: matrix.platform == 'darwin'
        shell: bash
        # The app inside the disk image must carry a valid seal: a broken one is
        # what Gatekeeper reports as "damaged" on Apple Silicon. Ad-hoc without
        # signing secrets; Developer ID (and notarized, stapled) with them.
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist-beta/*.dmg
          app="$(ls -d "$mount"/*.app)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$MAC_SIGNING" = true ]; then
            # Capture first: grep -q stops reading at its match, and tee then
            # fails on the closed pipe under pipefail.
            details="$(codesign -dvv "$app" 2>&1)"
            echo "$details"
            grep -q 'Authority=Developer ID Application' <<< "$details"
            if [ "$MAC_NOTARIZING" = true ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=4 "$app"
            fi
          else
            details="$(codesign -dv "$app" 2>&1)"
            echo "$details"
            grep -q 'Signature=adhoc' <<< "$details"
          fi
          test -L "$mount/Applications"
          ls -la "$mount" "$mount/.background" || true
          hdiutil detach "$mount"
      - name: Check the Windows signature users get
        if: matrix.platform == 'win32' && (env.ESIGNER_SIGNING == 'true' || env.AZURE_SIGNING == 'true')
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist-beta/*-setup.exe) + @(Get-ChildItem "dist-beta/win-unpacked/*.exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed" }
          }
      - name: Install the .deb (Linux)
        if: matrix.platform == 'linux'
        # The smoke test runs the installed package, as users get it. On this
        # Ubuntu 24.04 runner, Chromium's sandbox works only because the
        # package installs its AppArmor profile, so this also checks that.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ./dist-beta/*.deb
      - name: Smoke test the packaged app
        shell: bash
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.platform }}" = linux ]; then
            xvfb-run -a node scripts/smoke-packaged.mjs "${{ matrix.unpacked }}"
          else
            node scripts/smoke-packaged.mjs "${{ matrix.unpacked }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: unoblox-beta-${{ matrix.artifact }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: ${{ matrix.files }}

  publish:
    name: Publish over-the-air update
    needs: installers
    if: inputs.publish && inputs.target == 'all'
    runs-on: ubuntu-24.04
    env:
      RELEASES_REPOSITORY: unoblox/unoblox-works-releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the publishing secrets
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::Add the UPDATE_SIGNING_KEY repository secret"; exit 1; }
          test -n "$RELEASES_TOKEN" || { echo "::error::Add the RELEASES_TOKEN repository secret"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: unoblox-beta-*
          path: release-assets
          merge-multiple: true
      - name: Sign latest.json and publish the release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")-beta.${{ github.run_number }}"
          tag="v$version"
          ls -la release-assets
          node scripts/make-update-manifest.mjs --version "$version" --dir release-assets \
            --base-url "https://github.com/$RELEASES_REPOSITORY/releases/download/$tag" \
            --out release-assets/latest.json
          # Draft first, so latest.json never points at files still uploading.
          gh release create "$tag" --repo "$RELEASES_REPOSITORY" --draft \
            --title "unoblox works $version" \
            --notes "unoblox works beta $version, built from ${{ github.sha }}." \
            release-assets/*
          gh release edit "$tag" --repo "$RELEASES_REPOSITORY" --draft=false --latest
          curl -fsSIL "https://github.com/$RELEASES_REPOSITORY/releases/latest/download/latest.json" > /dev/null
          echo "Published $tag"
