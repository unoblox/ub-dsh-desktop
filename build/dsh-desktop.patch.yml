# Harness's runtime warnings and errors live only in an in-memory logger ring,
# and session activation failures only reach the client. Bridge both to
# stderr so harness.log keeps them. First, so it hears as much as it can.
- insert:
    - id: dsh-desktop-log-bridge
      name: dsh-desktop-log-bridge

# Keep the stock directory-picker (auto) row active: the native backend
# serves ctx.directoryPicker, so host-side consumers (host.pickDirectory,
# plugins reading the seam) work unmodified. The client surface reads the
# upstream __DSH_DIRECTORY_PICKER__ bridge exposed by preload.

# Disable the stock single-slot occupant before mounting Desktop's equivalent;
# two occupants cannot share either brand seat. The Desktop plugin preserves
# the stock conversation mark. The phone remains in the settings row because
# the public footer-action slot is a separate row. Window chrome geometry
# remains a native-shell concern.
- id: ui-brand-official
  disabled: true

# Keep the v0.9.2 settings launcher and model setup without upstream account UI.
- id: ui-settings-account
  disabled: true

# Unoblox is the only model provider. Its gateway speaks the OpenAI Chat
# Completions API (https://unoblox.ai/docs/quickstart), so it is one
# hand-declared llm-pi-ai route rather than a new adapter.
#
# This file is a CLI overlay: it outranks the profile and replaces each
# entry's config wholesale, so the provider set below hides any route a profile
# declared, and the settings service refuses Models-page writes that would add
# another. The key never appears here: `UNOBLOX_API_KEY` names a credential the
# first-run dialog or Settings -> Models stores in the Harness credential store.
- id: llm-pi-ai
  config:
    providers:
      unoblox:
        displayName: Unoblox
        apiKeyEnv: UNOBLOX_API_KEY
        api: openai-completions
        baseURL: https://api.unoblox.ai/v1
        models:
          # The Unoblox router picks the best-value model that can serve the
          # request and fails over across upstream providers.
          - id: unoblox/auto
            name: Unoblox Auto

# The official DeepSeek API-key and account routes.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: agent-default-model
  config:
    provider: unoblox
    model: unoblox/auto

# Web search runs through Unoblox (POST /v1/search, Perplexity Search API) with
# the same stored UNOBLOX_API_KEY as chat. Only the query text is sent: to
# Unoblox and on to Perplexity (United States). The stock DeepSeek backend
# called DeepSeek directly with a DeepSeek key, so it stays off. web_fetch runs
# locally and is not billed by Unoblox.
- id: web-search-deepseek
  disabled: true

- insert:
    - id: dsh-desktop-unoblox-search
      name: dsh-desktop-unoblox-search

# The strip under the composer shows what Unoblox reports: the public search
# price, and the balance, charge and routed model from the latest chat
# response (published by the dsh-llm-pi-ai patch as `llm-pi-ai/response`).
# The key stays host-side; the strip only learns whether one is stored.
- insert:
    - id: dsh-desktop-unoblox-info
      name: dsh-desktop-unoblox-info

- id: web
  config:
    searchProvider: unoblox
    fetchProvider: http

- id: tool-web
  config:
    search: true
    fetch: true
    searchTimeoutMs: 30000

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui

    - id: dsh-desktop-workbenches
      name: dsh-desktop-workbenches
      config:
        root: !!js dshHomePath('desktop-workbenches')

    - id: dsh-desktop-onboarding
      name: dsh-desktop-onboarding

    # DSH Desktop owns the fixed-target dsh-market installer and its lightweight
    # settings entry. After dshmarket is installed and Harness restarts, the
    # community plugin replaces the placeholder with its complete market UI.
    - id: dsh-desktop-market-installer
      name: dsh-desktop-market-installer

    # One shared image tool for conversations and Office workflows.
    - id: dsh-image-generation
      name: dsh-image-generation

    # DSH PPT owns one direct PPTD workflow and one standard Composer client.
    # The package contains no Tencent editor runtime or SlideP route.
    - id: dsh-ppt-composer
      name: 'dsh-ppt-composer'
      config:
        root: !!js dshHomePath('kimi-ppt')

# Harness creates the full Cordis HMR service after boot when no `hmr` service
# exists, and that service throws without Node's internal module loader —
# which a packaged Electron app cannot provide, so every signed macOS launch
# failed profile boot at that step. This row supplies the config-watching
# subset `watchUserPatches` actually needs; where the internals are reachable
# it stands aside and the real service loads unchanged.
- insert:
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback

# Preset package export and import. These two routes lived in a patch on
# dsh-host-apiproxy until 0.1.2-alpha.1 deleted that package; upstream ships no
# preset transfer of its own, so the capability moved into a desktop plugin
# that registers on the Connection fetch-route seam instead.
- insert:
    - id: dsh-desktop-preset-transfer
      name: dsh-desktop-preset-transfer

# Offline Office authoring is installation-owned and shared by agent presets.
- insert:
    - id: dsh-desktop-office
      name: dsh-desktop-office
      config:
        resources: !!js process.env.DSH_DESKTOP_OFFICE_RESOURCES
        cli: !!js process.env.DSH_DESKTOP_OFFICE_CLI
