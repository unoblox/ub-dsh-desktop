# Harness's runtime warnings and errors live only in an in-memory logger ring,
# and session activation failures only reach the client. Bridge both to
# stderr so harness.log keeps them. First, so it hears as much as it can.
- insert:
    - id: dsh-desktop-log-bridge
      name: dsh-desktop-log-bridge

# Recovery composition: keep only Desktop branding and the runtime adapter
# required by packaged Electron. Do not import the normal Desktop patch here:
# PPT, market installation and preset transfer must not block safe-mode boot.
- id: ui-brand-official
  disabled: true

# Match the normal Desktop settings/model setup during recovery.
- id: ui-settings-account
  disabled: true

# Same provider lock as dsh-desktop.patch.yml: unoblox is the only model route,
# so recovery does not resurface DeepSeek. Keep the model rows identical to the
# normal patch. Web search stays off here: the unoblox search plugin is an
# optional product plugin, which recovery must not load.
- id: llm-pi-ai
  config:
    providers:
      unoblox:
        displayName: unoblox
        apiKeyEnv: UNOBLOX_API_KEY
        api: openai-completions
        baseURL: https://api.unoblox.ai/v1
        # The live unoblox catalog, `unoblox/auto` first: the Desktop main
        # process fills DSH_DESKTOP_UNOBLOX_MODELS per launch from
        # GET /v1/models (src/main/unoblox/model-catalog.ts), falling back to
        # its cached copy. Missing or malformed, only Auto is offered: the
        # unoblox router picks the best-value model and fails over.
        models: !!js "(() => { try { const rows = JSON.parse(process.env.DSH_DESKTOP_UNOBLOX_MODELS || '[]'); if (Array.isArray(rows) && rows.length > 0) return rows } catch {} return [{ id: 'unoblox/auto', name: 'unoblox Auto · best value' }] })()"

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: agent-default-model
  config:
    provider: unoblox
    model: unoblox/auto

# Privacy: unoblox collects nothing from the user's machine and talks to no
# server on its own except the unoblox API. Upstream rows that would send data
# elsewhere are switched off here, not left to a profile-name check:
# - session-telemetry-otel / otel: a Like/Dislike (or /feedback) uploaded the
#   whole session log with an anonymous user id to DeepSeek's OTel collector.
#   Feedback itself stays local (message-feedback keeps working).
# - product-analytics / desktop-product-telemetry: usage events (model,
#   clicks, plugins, device and user ids) to the same collector; dormant only
#   because the profile is not named "desktop".
# - deepseek-account / account-controller: DeepSeek platform sign-in and
#   balance (platform.deepseek.com, api.deepseek.com); unused without the
#   DeepSeek routes.
# - deepseek-llm-api-extensions / session-log-deepseek /
#   plugin-package-inventory-deepseek: attach the session log and plugin list
#   to DeepSeek API requests; the DeepSeek routes are disabled anyway.
# - message-feedback / ui-message-feedback / command-feedback: the Like and
#   Dislike buttons, feedback dialog and /feedback existed to send the session
#   to DeepSeek; with that gone they would promise a submission that goes
#   nowhere, so they are removed.
# - ui-plugin-manager: no npm-registry ping when the install dialog opens.
- id: session-telemetry-otel
  disabled: true

- id: otel
  disabled: true

- id: product-analytics
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: deepseek-account
  disabled: true

- id: account-controller
  disabled: true

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: message-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: command-feedback
  disabled: true

- id: ui-plugin-manager
  config:
    registryProbeEnabled: false

- id: web-search-deepseek
  disabled: true

- id: web
  config:
    fetchProvider: http

- id: tool-web
  config:
    search: false
    fetch: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback
