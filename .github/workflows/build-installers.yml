name: Build unsigned installers

# Unsigned, isolated development installers for every desktop platform, built
# on native runners (packaging is never cross-compiled: scripts/verify-target
# refuses it). Nothing is published, signed or notified; the installers are
# kept as workflow artifacts. Signed releases stay in release.yml.
#
# The development config (electron-builder.dev.cjs) gives the app its own
# appId, name and userData, and turns off the auto-update manager, so these
# builds never install over, or update to, a release build.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        required: false
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
          - linux

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.label }}
    if: inputs.target == 'all' || inputs.target == matrix.family
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            family: macos
            runner: macos-15
            platform: darwin
            arch: arm64
            builder: npx --no-install electron-builder --mac --arm64
            artifact: macos-apple-silicon
            files: |
              dist-dev/*.dmg
              dist-dev/*.zip
          - label: macOS Intel
            family: macos
            runner: macos-15-intel
            platform: darwin
            arch: x64
            builder: npx --no-install electron-builder --mac --x64
            artifact: macos-intel
            files: |
              dist-dev/*.dmg
              dist-dev/*.zip
          - label: Windows x64
            family: windows
            runner: windows-2022
            platform: win32
            arch: x64
            builder: node scripts/electron-builder-windows.mjs --win --x64
            artifact: windows-x64
            files: |
              dist-dev/*-setup.exe
          - label: Linux x64
            family: linux
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            builder: npx --no-install electron-builder --linux --x64
            artifact: linux-x64
            files: |
              dist-dev/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: Test
        run: npx --no-install vitest run
        timeout-minutes: 20
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/verify-target.mjs ${{ matrix.platform }} ${{ matrix.arch }} && ${{ matrix.builder }} --publish never --config electron-builder.dev.cjs
      - name: Smoke test the packaged Linux app
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a node scripts/smoke-packaged-linux.mjs dist-dev/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-dev-${{ matrix.artifact }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
          path: ${{ matrix.files }}
