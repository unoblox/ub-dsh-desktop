# Harness's runtime warnings and errors live only in an in-memory logger ring,
# and session activation failures only reach the client. Bridge both to
# stderr so harness.log keeps them. First, so it hears as much as it can.
- insert:
    - id: dsh-desktop-log-bridge
      name: dsh-desktop-log-bridge

# Recovery composition: keep only Desktop branding and the runtime adapter
# required by packaged Electron. Do not import the normal Desktop patch here:
# PPT, market installation and preset transfer must not block safe-mode boot.
- id: ui-brand-official
  disabled: true

# Match the normal Desktop settings/model setup during recovery.
- id: ui-settings-account
  disabled: true

# Same provider lock as dsh-desktop.patch.yml: Unoblox is the only model route,
# so recovery does not resurface DeepSeek. Keep the model rows identical to the
# normal patch. Web search stays off here: the Unoblox search plugin is an
# optional product plugin, which recovery must not load.
- id: llm-pi-ai
  config:
    providers:
      unoblox:
        displayName: Unoblox
        apiKeyEnv: UNOBLOX_API_KEY
        api: openai-completions
        baseURL: https://api.unoblox.ai/v1
        # The live Unoblox catalog, `unoblox/auto` first: the Desktop main
        # process fills DSH_DESKTOP_UNOBLOX_MODELS per launch from
        # GET /v1/models (src/main/unoblox/model-catalog.ts), falling back to
        # its cached copy. Missing or malformed, only Auto is offered: the
        # Unoblox router picks the best-value model and fails over.
        models: !!js "(() => { try { const rows = JSON.parse(process.env.DSH_DESKTOP_UNOBLOX_MODELS || '[]'); if (Array.isArray(rows) && rows.length > 0) return rows } catch {} return [{ id: 'unoblox/auto', name: 'Unoblox Auto' }] })()"

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: agent-default-model
  config:
    provider: unoblox
    model: unoblox/auto

- id: web-search-deepseek
  disabled: true

- id: web
  config:
    fetchProvider: http

- id: tool-web
  config:
    search: false
    fetch: true

- insert:
    - id: dsh-desktop-client-ui
      name: dsh-desktop-client-ui
    - id: dsh-desktop-hmr-fallback
      name: dsh-desktop-hmr-fallback
